name: Deploy Static Site to GitHub Pages

on:
  # تشغيل عند الدفع إلى الفرع الرئيسي
  push:
    branches: ["main"]
  
  # السماح بالتشغيل اليدوي من تبويب Actions
  workflow_dispatch:

# تعيين الصلاحيات المطلوبة لنشر GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# السماح بنشر واحد فقط في الوقت الواحد
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # مهمة واحدة بسيطة للنشر
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # رفع المجلد الجذر بالكامل
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
